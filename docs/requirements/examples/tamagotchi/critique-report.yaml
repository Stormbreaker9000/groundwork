# Design critique — tamagotchi design set, CRITIQUE ROUND 3
# Produced by agents/design-critic.md against the merged, back-filled artifact set
# (19 components CMP-001..CMP-019, 31 interfaces IF-001..IF-031), asr_analysis (20),
# requirements_digest (26), and capability_map (56).
#
# Round 1 returned gate: fail with ten findings F-01..F-10, all discharged at round 2.
# Round 2 returned gate: fail with four findings F-11..F-14. All four are discharged
# here. No finding is carried forward and no new finding is raised, so the finding
# register is empty and the gate is PASS.
#
# `validator` is deliberately null: this critique runs before anything is on disk and
# before drivers.md exists. The structural gate is the formatter's re-run of
# validate_design.py, folded back into this field by the orchestrator.

critique_report:
  gate: pass

  validator: null

  # =========================================================================
  # ROUND-2 DISCHARGE LEDGER — verdict on each of F-11..F-14. A finding is
  # DISCHARGED only where the defect is gone, not where it has been moved to a
  # different artifact or one layer down.
  # =========================================================================
  round_2_discharge:

    - id: F-11
      verdict: discharged
      targets: [CMP-003]
      note: >
        CMP-003's stated responsibility now covers both contracts it provides. It reads
        "Holds the application's live pet state as its sole custodian, mediating every read
        of it, every replacement of it and every commit of it to durable storage", and the
        description names "the point from which it is committed to durable storage on both
        of FR-001's persist triggers". IF-029 `commit_before_close` is now inside the stated
        responsibility rather than outside it, which is what BR-002's convergence argument
        leans on: a reader checking "every code path that writes, clears or replaces
        persisted pet state" against CMP-003's responsibility now finds the close path in it.

        The body was fixed at the same place the round-2 finding located the defect. It no
        longer describes CMP-003 as the observation point for one of FR-001's two triggers;
        it ties both triggers to this component and states why the close trigger is asked
        for here rather than by the closing caller reading the live state out and committing
        it itself — "a second commit path opened at close would reopen the inspection
        BR-002's convergence argument depends on being finite". That is the argument the
        round-2 finding said was missing, made explicitly.

        Checked and cleared on the single-responsibility criterion, since the fix widens a
        responsibility statement and that is exactly where over-correction would show: the
        three-way mediation clause is one duty (sole custodianship of the live pet state)
        elaborated by its exhaustive surface, not two duties joined by an "and". It is the
        same shape as CMP-002 (read plus once-per-session load), CMP-006 (entry plus wake
        deadline), CMP-012 (commit plus retrieval) and CMP-017 (the seam enumeration), all
        of which passed in earlier rounds. traces_from is unchanged and remains plausible:
        FR-001 carries both triggers in its own text, so no new citation was warranted.

    - id: F-12
      verdict: discharged
      targets: [CMP-017, IF-027]
      note: >
        The false premise is gone from both artifacts that carried it, and the conclusion —
        which round 2 accepted — is unchanged and now rests only on the leg that holds.

        IF-027's Interaction section previously argued `announce_status_text` was "a local
        in-process call into a native accessibility stack, with no remote party". It now
        says the premise was wrong outright: "On some targets the announcement goes to an
        accessibility bridge inside this process; on others it crosses to a service in its
        own right, AT-SPI on a CON-003 Linux target being a D-Bus service, which is why this
        contract's own third and sixth error modes have that stack absent, not running, or
        un-integrated." The interaction verdict is unchanged and the body now argues it the
        stronger way — a party on the other end that can be missing is precisely why the
        caller must learn the announcement did not land. Prose and field agree, and the
        prose no longer contradicts the error modes sitting immediately below it.

        CMP-017's matching sibling assumption is corrected the same way and generalised
        correctly. Its body now states that the rendering surface, accessibility exposure
        and timer access are kept out of the external component set by "the integration-point
        list this stage inherited, not a belief that there is no party on the other end of
        the call", and says in the same paragraph that all three are real platform facilities
        that can be absent or not running in a given session. That is the design-context leg
        round 2 accepted, applied on the same threshold the set already applies to the file
        primitives. Worth noting that the fix was made general rather than local: it now
        covers the timer seam introduced by the F-14 fix, so the corrected premise did not
        have to be re-derived for IF-031 and IF-031 does not reintroduce the defect.

    - id: F-13
      verdict: discharged
      targets: [IF-030]
      note: >
        `refresh` now takes the pre-advance pet state, and the error mode that claimed the
        comparison was unavailable is gone rather than reworded. The operation summary
        carries the condition itself — announce "where the pet's mood expression or health
        status differs from the one the supplied pre-advance pet state carried" — so the
        suppression is a property of the contract rather than a discipline the caller keeps.

        The shape is the one round 2 named as the fix and is the shape the set already used
        twice: IF-007 `select` and IF-015 `raise_for_stat_change` take the same pre/post
        pair from the same holder, CMP-009, which holds both states at the moment it calls.
        The body says so and says the comparison "was never unavailable ... the previous
        round simply had not asked for it", which is the honest account rather than a
        retrofitted justification.

        The single replaced error mode became three, and the three partition the space
        correctly: suppression when nothing perceivable changed (with the NFR-003 reason —
        an unchanged mood and health status repeated at cadence frequency is a failure, not
        a harmless redundancy); no pre-state supplied, where the announcement fires because
        a repeated announcement is the better of the two failures; and a wrong pre-state,
        which is conceded as undetectable here, which is why the caller that caused the
        advance supplies it. That last one is the same honest residual F-06's fix left on
        IF-007, stated in the same terms. The split of what is conditioned is right too:
        only the announcement is suppressed, while the visual redraw runs either way, so the
        frame never lags the live pet state.

    - id: F-14
      verdict: discharged
      targets: [CMP-010, CMP-017, IF-010, IF-031]
      note: >
        The seam moved into the layer rather than the finding moving down a level, and the
        four artifacts involved now agree with each other.

        What is now true: capability_map carries CMP-010 -> "drive a recurring tick at a
        fixed period from the host's timer facility" -> IF-031; CMP-010 depends_on
        [IF-009, IF-031] and cites NFR-002 and NFR-006 in traces_from; CMP-017's description
        enumerates "recurring-timer access" alongside the other five seams and its body
        argues the allocation from NFR-006's own clause, "wall-clock and timer access";
        IF-031 Platform Recurring Timer exists with CMP-017 as provider. IF-010's first
        error mode no longer declares a bare platform failure — it now reports IF-031's
        refusal and passes it on, which is a failure its provider can structurally have
        because its provider now asks a contract that can refuse. CMP-010 keeps what is
        genuinely its own (period, coalescing rule, when the cadence starts and stops) and
        consumes only the tick.

        On whether the defect was relocated one layer down, which is the question that
        decides this discharge. It was not, and the criterion separates the two cases
        cleanly. The round-2 defect was that CMP-010 — an ordinary internal component with
        no platform seam of any kind — declared a platform-level failure it had no
        structural way to observe. CMP-017 is the platform-adapter layer: having platform
        failures is its entire reason to exist, and the set already treats it that way in
        IF-019 (the local data directory cannot be resolved on this platform), IF-020 (the
        move degrades to copy-then-delete across a filesystem boundary), IF-021, IF-025 (the
        rename is not atomic on this platform or filesystem) and IF-027 (no rendering
        surface available). IF-031's failures are of exactly that class and are stated at
        the same altitude.

        On whether a timer needs an outward capability of its own the way the clock does —
        it does not, and the asymmetry is principled rather than convenient. Two reasons,
        and the second is the substantive one. First, the inherited design context names
        exactly two integration points, the OS notification service and the platform wall
        clock, and CMP-019 exists because the clock is one of them; the set applies that
        same threshold to the filesystem, the rendering surface and the accessibility stack,
        all of which are real facilities modelled as raw adapter capability with no external
        component on the far end. Adding an external timer component would break that
        consistency, not restore it. Second, and independently: the wall clock is a reading
        of state owned outside the process and movable by the owner, which is why A-7 — the
        assumption that backward movement is observable rather than smoothed — needs an
        external component to live on, and why IF-024 carries it as a failure mode. A
        recurring timer supplies no state and no time information at all; it supplies
        occasions. IF-031 makes that explicit in its third error mode: the delivered period
        is approximate and "a caller must never read elapsed time from a tick count and must
        take it from the wall clock (IF-018) instead". A facility that carries no readings
        carries no assumption of the kind CMP-019 exists to hold, so it is legitimately a
        facility of the adapter's own runtime. CMP-017's body reaches the same conclusion by
        the same distinction — "Reading the clock answers what time it is; a recurring timer
        drives the application without being asked" — and it separates the two contracts for
        that reason rather than folding them, which is right: five components read the clock
        and one is driven by a tick, so a merged contract would hand every clock reader a
        timer it never starts.

        IF-031's own quality checked against Phase 1, since it has never been reviewed.
        Every error mode names a failure a consumer branches on — no usable timer facility;
        a non-positive or sub-resolution period rejected rather than coerced to the fastest
        tick the host can deliver, with NFR-002's budget as the stated reason; late, dropped
        and drifting ticks not back-filled; a handler that raises not silently cancelling the
        timer; cancel waiting out a delivery in flight; cancel unable to confirm quiescence
        within a bounded wait, reported rather than returned as success; and idempotency in
        both directions. The last two are load-bearing rather than decorative: IF-010's stop
        now states quiescence as two halves, IF-031's cancel confirming that no further tick
        will be delivered and IF-010 waiting out any evaluation already in flight, and
        IF-029's second error mode requires that ordering for the close path. Both operations
        are declared synchronous and the body justifies each separately — start_recurring
        returns whether a timer facility exists at all, cancel returns quiescence as an
        ordering guarantee — so the per-operation interaction rule is satisfied by argument
        and not by a claim about the contract's dominant mode. The body's treatment of the
        tick deliveries themselves is correct on the same rule: they are deliveries the
        provider makes to a handler, not calls the consumer makes on this contract, so they
        are not operations of it and the contract is not mixed-mode.

        Two observations checked and deliberately NOT raised as findings, recorded here so
        the trail shows they were examined. (1) IF-031's Rationale says "stoppability is what
        the capability names"; the capability string names driving a recurring tick and does
        not literally name stopping. `cancel` is nonetheless required by the design rather
        than surplus — IF-010's `stop` and the close-path ordering IF-029 depends on are
        unimplementable without it — and the Phase 1 criterion tests operations for
        under-specification against the capabilities, not for over-specification. A terse
        capability string and one sentence overstating it mislead no reader into a wrong
        decision, so this is below the threshold applied in rounds 1 and 2 and is not a
        finding. (2) CMP-017 carries confidence high while IF-031 carries low. That is
        coherent rather than contradictory: the layer's shape and the fact that timer access
        belongs in it follow directly from NFR-006's clause and are settled, while the
        period — and, as IF-031 concedes, whether a fixed-period recurring primitive is the
        right seam at all — follow from Q-10, which is still_open. The residual is recorded
        below as a sensitivity point and in the timer tradeoff's cost, which is where a
        documented open parameter belongs.

