review_queue:
- id: CMP-002
  confidence: low
  reason: Q-1 (still open) leaves every balance and tuning value this component carries unfixed; only its shape — a read-only parameter set with one owner, filled once at launch — is settled
- id: CMP-005
  confidence: low
  reason: FR-008's per-stat below-threshold clock has no field in the Pet state enumeration, and whether it is reconstructed from the decay curve or persisted as a new field is open under Q-10/Q-11 (ADR-005, still proposed)
- id: CMP-010
  confidence: low
  reason: Q-10 (still open) leaves the running re-evaluation interval unfixed, and NFR-002 — the constraint that would bound it from the other side — is not evaluable until Q-5 records a reference machine
- id: CMP-016
  confidence: low
  reason: Q-8 (still open) — whether the Sleeping state is rendered to the owner — is a question about precisely this component's surface, and no requirement renders Sleeping today
- id: IF-004
  confidence: low
  reason: what `advance` can be given, and whether A-22's persisted enumeration must grow, follow from the undecided storage of FR-008's below-threshold clock (Q-10/Q-11, ADR-005 still proposed)
- id: IF-010
  confidence: low
  reason: whether `start` carries a period at all, and whether that period is fixed, adaptive or event-driven, follows from Q-10's answer (still open), with NFR-002 constraining it from the other side
- id: IF-031
  confidence: low
  reason: the fixed period `start_recurring` takes — and whether a recurring-tick primitive is the right seam at all — changes with Q-10's answer (still open), which NFR-002 constrains from the other side
- id: ADR-005
  confidence: low
  reason: proposed, not accepted — the below-threshold-clock storage decision is deferred to open question Q-11
- id: ADR-006
  confidence: low
  reason: proposed, not accepted — the evaluation-cadence period is deferred to open question Q-12, and cannot be measured until Q-5 records a reference machine
- id: ADR-007
  confidence: low
  reason: proposed, not accepted — CON-001's exclusion screen cannot be run, nor a pass or fail recorded, until Q-5 records a reference machine (tracked as Q-13)
